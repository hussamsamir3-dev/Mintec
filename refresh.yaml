name: Refresh market desk

on:
  schedule:
    - cron: "5 * * * *"        # every hour at :05 UTC
  workflow_dispatch:            # and a manual "Run workflow" button

permissions:
  contents: write               # needed to commit the rebuilt dashboard

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet openpyxl requests

      - name: Pull latest prices from Mintec
        env:
          MINTEC_CLIENT_ID: ${{ secrets.MINTEC_CLIENT_ID }}
          MINTEC_CLIENT_SECRET: ${{ secrets.MINTEC_CLIENT_SECRET }}
        run: python mintec_refresh.py --from-api --workbook materials.csv --html index.html

      - name: Commit if anything changed
        run: |
          git config user.name  "market-desk-bot"
          git config user.email "market-desk-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No price changes this hour."
          else
            git commit -m "Prices refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
